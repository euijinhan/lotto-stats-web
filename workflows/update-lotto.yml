name: Update Lotto History (KST Sat 23:00)

on:
  schedule:
    # 매주 토요일 밤 23:00 KST (UTC+9) = 매주 토요일 14:00 UTC
    - cron: '0 14 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lotto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch incremental Lotto draws
        run: python scripts/fetch_lotto.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotto-history.json
          if git diff --staged --quiet; then
            echo "변경된 회차가 없습니다."
          else
            git commit -m "chore: update lotto history ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST'))"
            git push
          fi
